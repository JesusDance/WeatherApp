services:
  app:
    container_name: weather-api
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
  redis:
    image: redis:7-alpine
    container_name: redis-weather-app
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
volumes:
  redis_data:

